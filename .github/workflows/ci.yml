name: CI — Módulo III Finanzas (Frontend Build)

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  frontend-build:
    name: Build Frontend (React + TypeScript + MUI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y compilar frontend
        run: npm ci && npm run build
